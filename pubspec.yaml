name: onepub
version: 7.1.0
homepage: https://onepub.dev
documentation: https://docs.onepub.dev
description: Command line tools for the OnePub private Dart/Flutter repository.
repository: https://github.com/onepub-dev/onepub
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  args: 2.7.0
  cli_util: ^0.6.0
  dart_console: ^5.1.2
  dcli_core: ^10.4.0
  dcli_input: ^10.4.1
  dcli_terminal: ^10.4.0
  path: 1.9.1
  pub_semver: ^2.2.1
  pubspec_manager: ^4.1.1
  scope: 5.1.0
  settings_yaml: ^8.3.2
  stack_trace: ^1.12.2
  strings: ^4.2.0
  url_builder: 2.0.0
  uuid: ^4.5.2
  validators2: ^5.1.0
  yaml: ^3.1.4
dev_dependencies:
  analyzer: ^14.7.0
  boolean_selector: 2.1.2
  dcli: ^10.4.3
  lint_hard: ^8.0.1
  test: ^1.25.5
executables:
  onepub:
platforms:
  linux:
  macos:
  windows:
false_secrets:
  - lib/src/pub/validator/leak_detection.dart
  - lib/src/pub/oauth2.dart
